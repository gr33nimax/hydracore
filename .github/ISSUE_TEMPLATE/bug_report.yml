name: HydraCore bug
description: Report a reproducible core, binding, or Android AAR problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private subscriptions, server addresses, or sensitive logs.
  - type: input
    id: version
    attributes:
      label: HydraCore version
      description: Release tag or full source commit.
      placeholder: v1.13.14-extended-hydracore.2
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and build tags
      placeholder: Android arm64, with_wireguard,...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal sanitized steps or configuration.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and private infrastructure data.
          required: true
        - label: I checked whether the issue is already reported.
          required: true
