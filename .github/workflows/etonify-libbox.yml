name: HydraCore · Android libbox (based on etonify-core)

on:
  push:
    branches:
      - extended-integration
    paths:
      - '.github/workflows/etonify-libbox.yml'
      - 'HYDRACORE.md'
      - '**/*.go'
      - 'adapter/**'
      - 'cmd/**'
      - 'common/**'
      - 'constant/**'
      - 'daemon/**'
      - 'dns/**'
      - 'experimental/**'
      - 'include/**'
      - 'log/**'
      - 'option/**'
      - 'protocol/**'
      - 'provider/**'
      - 'release/**'
      - 'route/**'
      - 'service/**'
      - 'transport/**'
      - 'box.go'
      - 'debug*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  pull_request:
    branches:
      - extended-integration
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydracore-libbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify baseline
        run: bash release/verify_etonify_baseline.sh
      - name: Test
        run: go test ./...
      - name: Test WireGuard libbox config gate
        run: go test -tags with_wireguard ./experimental/libbox
      - name: Race test HydraCore inherited runtime paths
        run: go test -race ./common/urltest ./daemon ./experimental/libbox ./protocol/vless/... ./transport/v2rayxhttp
      - name: Resource and performance gate
        run: bash release/verify_etonify_performance.sh

  android:
    name: Build verified Android AAR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28
      - name: Verify baseline
        run: bash release/verify_etonify_baseline.sh
      - name: Set HydraCore build version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          if ! [[ "$version" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]{0,126}$ ]]; then
            echo "::error title=Invalid HydraCore version::Found '${version}'" >&2
            exit 1
          fi
          if existing="$(git rev-parse -q --verify "refs/tags/${version}" 2>/dev/null)" && \
             [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error title=HydraCore tag collision::${version} points to ${existing}" >&2
            exit 1
          fi
          git tag -f "$version" "$GITHUB_SHA"
      - name: Install pinned gomobile
        run: make lib_install
      - name: Build libbox
        run: |
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          make lib_android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - name: Prepare provenance
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          source release/ETONIFY_BASELINE
          etonify_version="$(tr -d '\r\n' < release/ETONIFY_VERSION)"
          hydracore_version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          test -f libbox.aar
          test -f libbox-sources.jar
          mkdir -p dist
          cp libbox.aar libbox-sources.jar dist/
          sha256sum libbox.aar > dist/libbox.aar.sha256
          git archive --format=tar HEAD | gzip -n > dist/hydracore-source.tar.gz
          commit="$(git rev-parse HEAD)"
          version="$(git describe --tags --always --dirty)"
          go_actual="$(go version)"
          java_actual="$(java --version 2>&1 | head -n 1)"
          ndk_revision="$(
            awk -F= '$1 ~ /^Pkg\.Revision[[:space:]]*$/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              print $2
            }' "$ANDROID_NDK_HOME/source.properties"
          )"
          test -n "$ndk_revision"
          cat > dist/provenance.json <<EOF
          {
            "artifact": "libbox.aar",
            "distribution_id": "io.hydrabox.hydracore",
            "distribution_name": "HydraCore",
            "upstream_project": "etonify-core",
            "sha256": "$(sha256sum libbox.aar | awk '{print $1}')",
            "source_commit": "${commit}",
            "source_version": "${version}",
            "hydracore_version": "${hydracore_version}",
            "etonify_version": "${etonify_version}",
            "upstream_commit": "${UPSTREAM_COMMIT}",
            "go": "${go_actual}",
            "gomobile": "${GOMOBILE_VERSION}",
            "java": "${java_actual}",
            "android_ndk": "${ndk_revision}",
            "android_ndk_requested": "${ANDROID_NDK_VERSION}",
            "android_api": ${LIBBOX_ANDROID_API},
            "build_tags": "${LIBBOX_BUILD_TAGS}"
          }
          EOF
      - name: Upload libbox artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydracore-libbox-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Prepare draft test release
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/extended-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: android
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Download verified libbox artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hydracore-libbox-${{ github.sha }}
          path: dist
      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check libbox.aar.sha256)
          hydracore_version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          etonify_version="$(tr -d '\r\n' < release/ETONIFY_VERSION)"
          source release/ETONIFY_BASELINE
          jq --exit-status \
            --arg commit "$GITHUB_SHA" \
            --arg hydracore_version "$hydracore_version" \
            --arg etonify_version "$etonify_version" \
            --arg android_ndk_requested "$ANDROID_NDK_VERSION" \
            '.source_commit == $commit and
             .hydracore_version == $hydracore_version and
             .etonify_version == $etonify_version and
             .android_ndk_requested == $android_ndk_requested' \
            dist/provenance.json >/dev/null
      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          test -n "$version"
          title="HydraCore ${version} — Android test build based on etonify-core"

          if gh release view "$version" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' release-state.json)" != "true" ]]; then
              echo "Refusing to replace published release ${version}" >&2
              exit 1
            fi
            gh release edit "$version" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release/HYDRACORE_RELEASE_NOTES.md
          else
            gh release create "$version" \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file release/HYDRACORE_RELEASE_NOTES.md
          fi

          gh release upload "$version" dist/* --clobber
