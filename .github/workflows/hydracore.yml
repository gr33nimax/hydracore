name: HydraCore - Verified Android and Linux runtime

on:
  push:
    branches:
      - main
      - debug
    paths:
      - '.github/workflows/hydracore.yml'
      - 'HYDRACORE.md'
      - '**/*.go'
      - 'adapter/**'
      - 'cmd/**'
      - 'common/**'
      - 'contract/**'
      - 'constant/**'
      - 'daemon/**'
      - 'dns/**'
      - 'experimental/**'
      - 'include/**'
      - 'log/**'
      - 'option/**'
      - 'protocol/**'
      - 'provider/**'
      - 'release/**'
      - 'route/**'
      - 'service/**'
      - 'transport/**'
      - 'box.go'
      - 'debug*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  pull_request:
    branches:
      - main
      - debug
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a verified main build or the HydraBox 1.0 debug prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: hydracore-libbox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify baseline
        run: bash release/verify_upstream_baseline.sh
      - name: Verify attribution boundaries
        run: bash release/verify_attribution_boundaries.sh
      - name: Test
        run: go test ./...
      - name: Test WireGuard libbox config gate
        run: go test -tags with_wireguard ./experimental/libbox
      - name: Test Call protocol build
        run: go test -tags with_call ./experimental/libbox ./protocol/call ./transport/call/... ./include
      - name: Test client Calls role
        run: go test -tags with_call_client ./experimental/libbox ./protocol/call ./transport/call/... ./include
      - name: Test VPS Calls role
        run: go test -tags with_call_server ./experimental/libbox ./protocol/call ./transport/call/... ./include
      - name: Race test Call telemetry and transport
        run: go test -race ./transport/call/telemetry ./transport/call/vk-parasite ./transport/call/tunnel
      - name: Verify wire v8 deterministic four-lane emulator
        run: go test ./transport/call/vk-parasite -run '^TestWireV8' -count=1
      - name: Race test HydraCore inherited runtime paths
        run: go test -race ./common/urltest ./daemon ./experimental/libbox ./protocol/vless/... ./transport/v2rayxhttp
      - name: Resource and performance gate
        run: bash release/verify_hydracore_performance.sh

  android:
    name: Build verified Android AAR
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenJDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28
      - name: Verify baseline
        run: bash release/verify_upstream_baseline.sh
      - name: Set HydraCore build version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          if ! [[ "$version" =~ ^v[0-9A-Za-z][0-9A-Za-z._+-]{0,126}$ ]]; then
            echo "::error title=Invalid HydraCore version::Found '${version}'" >&2
            exit 1
          fi
          build_tag="$version"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # A pull request is checked out at a synthetic merge commit. It must
            # never attempt to move the immutable release tag stored in
            # HYDRACORE_VERSION, but gomobile still needs a tag on HEAD for
            # deterministic version metadata.
            build_tag="${version}-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
          elif existing="$(git rev-parse -q --verify "refs/tags/${version}" 2>/dev/null)" && \
               [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error title=HydraCore tag collision::${version} points to ${existing}" >&2
            exit 1
          fi
          git tag -f "$build_tag" "$GITHUB_SHA"
      - name: Install pinned gomobile
        run: make lib_install
      - name: Build libbox
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export HYDRACORE_BUILD_VERSION="$version"
          make lib_android
          for abi in arm64-v8a armeabi-v7a x86_64; do
            library="$RUNNER_TEMP/hydracore-${abi}.so"
            unzip -p libbox.aar "jni/${abi}/libbox.so" > "$library"
            if ! grep -aF -- "$version" "$library" >/dev/null; then
              echo "::error title=HydraCore native version mismatch::${abi} does not contain ${version}" >&2
              exit 1
            fi
          done
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          HYDRACORE_BUILD_ROLE: client
      - name: Prepare provenance
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          source release/UPSTREAM_BASELINE
          hydracore_version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          test -f libbox.aar
          test -f libbox-sources.jar
          mkdir -p dist
          cp libbox.aar dist/hydracore-client-libbox.aar
          cp libbox-sources.jar dist/hydracore-client-libbox-sources.jar
          cp contract/subscription/HYDRA_SUBSCRIPTION_V2.md dist/
          cp contract/subscription/schema/hydra-subscription-v2.schema.json dist/
          cp contract/subscription/schema/hydra-subscription-jwe-v2.schema.json dist/
          (cd dist && sha256sum hydracore-client-libbox.aar > hydracore-client-libbox.aar.sha256)
          (cd dist && sha256sum hydracore-client-libbox-sources.jar > hydracore-client-libbox-sources.jar.sha256)
          (cd dist && sha256sum HYDRA_SUBSCRIPTION_V2.md > HYDRA_SUBSCRIPTION_V2.md.sha256)
          (cd dist && sha256sum hydra-subscription-v2.schema.json > hydra-subscription-v2.schema.json.sha256)
          (cd dist && sha256sum hydra-subscription-jwe-v2.schema.json > hydra-subscription-jwe-v2.schema.json.sha256)
          git archive --format=tar HEAD | gzip -n > dist/hydracore-source.tar.gz
          (cd dist && sha256sum hydracore-source.tar.gz > hydracore-source.tar.gz.sha256)
          commit="$(git rev-parse HEAD)"
          version="$(git describe --tags --always --dirty)"
          go_actual="$(go version)"
          java_actual="$(java --version 2>&1 | head -n 1)"
          ndk_revision="$(
            awk -F= '$1 ~ /^Pkg\.Revision[[:space:]]*$/ {
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2)
              print $2
            }' "$ANDROID_NDK_HOME/source.properties"
          )"
          test -n "$ndk_revision"
          aar_sha256="$(sha256sum dist/hydracore-client-libbox.aar | awk '{print $1}')"
          sources_sha256="$(sha256sum dist/hydracore-client-libbox-sources.jar | awk '{print $1}')"
          source_sha256="$(sha256sum dist/hydracore-source.tar.gz | awk '{print $1}')"
          subscription_spec_sha256="$(sha256sum dist/HYDRA_SUBSCRIPTION_V2.md | awk '{print $1}')"
          subscription_schema_sha256="$(sha256sum dist/hydra-subscription-v2.schema.json | awk '{print $1}')"
          subscription_jwe_schema_sha256="$(sha256sum dist/hydra-subscription-jwe-v2.schema.json | awk '{print $1}')"
          client_build_tags="${LIBBOX_BUILD_TAGS//with_call/with_call_client}"
          build_tags_json="$(jq -Rn --arg tags "$client_build_tags" '$tags | split(",")')"
          cat > dist/provenance.json <<EOF
          {
            "schema_version": 3,
            "distribution": {
              "id": "io.hydrabox.hydracore",
              "name": "HydraCore",
              "version": "${hydracore_version}",
              "role": "client"
            },
            "source": {
              "repository": "https://github.com/gr33nimax/hydracore",
              "commit": "${commit}",
              "version": "${version}"
            },
            "upstream": {
              "project": "sing-box-extended",
              "repository": "${UPSTREAM_REPOSITORY}",
              "branch": "${UPSTREAM_BRANCH}",
              "tag": "${UPSTREAM_TAG}",
              "commit": "${UPSTREAM_COMMIT}"
            },
            "toolchain": {
              "go": "${go_actual}",
              "gomobile": "${GOMOBILE_VERSION}",
              "java": "${java_actual}",
              "build_tags": ${build_tags_json}
            },
            "android": {
              "ndk": "${ndk_revision}",
              "ndk_requested": "${ANDROID_NDK_VERSION}",
              "api": ${LIBBOX_ANDROID_API}
            },
            "artifacts": {
              "hydracore-client-libbox.aar": {"sha256": "${aar_sha256}"},
              "hydracore-client-libbox-sources.jar": {"sha256": "${sources_sha256}"},
              "hydracore-source.tar.gz": {"sha256": "${source_sha256}"},
              "HYDRA_SUBSCRIPTION_V2.md": {"sha256": "${subscription_spec_sha256}"},
              "hydra-subscription-v2.schema.json": {"sha256": "${subscription_schema_sha256}"},
              "hydra-subscription-jwe-v2.schema.json": {"sha256": "${subscription_jwe_schema_sha256}"}
            },
            "lineage": [
              {"project": "sing-box", "role": "origin"},
              {"project": "sing-box-extended", "role": "active-upstream"},
              {"project": "etonify-core", "role": "historical-mobile-integration"}
            ]
          }
          EOF
          jq --exit-status . dist/provenance.json >/dev/null
      - name: Build independently updateable Android bundle
        shell: bash
        env:
          HYDRACORE_BUNDLE_KEY_ID: ${{ vars.HYDRACORE_BUNDLE_KEY_ID }}
        run: |
          set -euo pipefail
          source release/UPSTREAM_BASELINE
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          key_id="${HYDRACORE_BUNDLE_KEY_ID:-hydracore-release-1}"
          published_at="$(git show -s --format=%cI HEAD)"
          client_build_tags="${LIBBOX_BUILD_TAGS//with_call/with_call_client}"
          go run -tags "$client_build_tags" \
            -ldflags "-X github.com/sagernet/sing-box/constant.Version=${version}" \
            ./cmd/internal/write_capabilities \
            > dist/hydracore-client-capabilities.json
          jq --exit-status --arg version "$version" \
            '.identity.core_version == $version and .identity.role == "client"' \
            dist/hydracore-client-capabilities.json >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          content = Path("dist/hydracore-client-capabilities.json").read_bytes()
          if not content or content.endswith(b"\n"):
              raise SystemExit("client capability bytes must match the native string exactly")
          PY
          go run ./cmd/internal/build_core_bundle \
            -aar libbox.aar \
            -capabilities dist/hydracore-client-capabilities.json \
            -out dist \
            -version "$version" \
            -source-commit "$GITHUB_SHA" \
            -upstream-commit "$UPSTREAM_COMMIT" \
            -published-at "$published_at" \
            -key-id "$key_id" \
            -release-sequence "$GITHUB_RUN_NUMBER"
          for artifact in \
            hydracore-client-capabilities.json \
            hydracore-bundle-manifest-v1.json \
            hydracore-android-arm64-v8a-libbox.so \
            hydracore-android-armeabi-v7a-libbox.so \
            hydracore-android-x86_64-libbox.so; do
            (cd dist && sha256sum "$artifact" > "${artifact}.sha256")
          done
          jq \
            --arg manifest "$(sha256sum dist/hydracore-bundle-manifest-v1.json | awk '{print $1}')" \
            --arg capabilities "$(sha256sum dist/hydracore-client-capabilities.json | awk '{print $1}')" \
            --arg arm64 "$(sha256sum dist/hydracore-android-arm64-v8a-libbox.so | awk '{print $1}')" \
            --arg armv7 "$(sha256sum dist/hydracore-android-armeabi-v7a-libbox.so | awk '{print $1}')" \
            --arg x86_64 "$(sha256sum dist/hydracore-android-x86_64-libbox.so | awk '{print $1}')" \
            '.artifacts["hydracore-bundle-manifest-v1.json"] = {sha256: $manifest} |
             .artifacts["hydracore-client-capabilities.json"] = {sha256: $capabilities} |
             .artifacts["hydracore-android-arm64-v8a-libbox.so"] = {sha256: $arm64} |
             .artifacts["hydracore-android-armeabi-v7a-libbox.so"] = {sha256: $armv7} |
             .artifacts["hydracore-android-x86_64-libbox.so"] = {sha256: $x86_64}' \
            dist/provenance.json > dist/provenance.next.json
          mv dist/provenance.next.json dist/provenance.json
      - name: Upload libbox artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydracore-client-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Build verified Linux ${{ matrix.arch }} runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify baseline
        run: bash release/verify_upstream_baseline.sh
      - name: Build reproducible VPS runtime
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          tags="$(tr -d '\r\n' < release/DEFAULT_BUILD_TAGS_OTHERS)"
          tags="${tags//with_call/with_call_server}"
          shared_ldflags="$(tr -d '\r\n' < release/LDFLAGS)"
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          asset="hydracore-vps-linux-${{ matrix.arch }}.tar.gz"
          mkdir -p package dist
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build \
              -trimpath \
              -tags "$tags" \
              -ldflags "-X github.com/sagernet/sing-box/constant.Version=${version} ${shared_ldflags} -s -w -buildid=" \
              -o package/sing-box \
              ./cmd/sing-box
          chmod 0755 package/sing-box
          if [[ "${{ matrix.arch }}" == "amd64" ]]; then
            package/sing-box version | grep -F "$version"
            package/sing-box hydra capabilities --json > capabilities.json
            jq --exit-status \
              '.identity.core_id == "io.hydrabox.hydracore" and
               .identity.role == "vps" and
               .features.call_vk_parasite == true and
               .features.call_vk_parasite_client == false and
               .features.call_vk_parasite_server == true and
               .features.call_vk_telemetry == true and
               .features.call_vk_four_lane_kcp == true and
               .features.call_vk_pre_kcp_admission == true and
               .features.call_vk_relay_flow_control == true and
               .protocols.call_modes == ["vk_parasite"] and
               .protocols.call_vk_parasite_wire == {"min": 8, "max": 8}' \
              capabilities.json >/dev/null
          fi
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C package sing-box | gzip -n > "dist/${asset}"
          (cd dist && sha256sum "$asset" > "${asset}.sha256")
          artifact_sha256="$(sha256sum "dist/${asset}" | awk '{print $1}')"
          build_tags_json="$(jq -Rn --arg tags "$tags" '$tags | split(",")')"
          cat > "dist/linux-provenance-${{ matrix.arch }}.json" <<EOF
          {
            "schema_version": 1,
            "distribution": {
              "id": "io.hydrabox.hydracore",
              "version": "${version}",
              "role": "vps"
            },
            "source": {
              "repository": "https://github.com/gr33nimax/hydracore",
              "commit": "${GITHUB_SHA}"
            },
            "runtime": {
              "os": "linux",
              "arch": "${{ matrix.arch }}",
              "cgo_enabled": false,
              "build_tags": ${build_tags_json}
            },
            "artifact": {
              "name": "${asset}",
              "binary": "sing-box",
              "sha256": "${artifact_sha256}"
            }
          }
          EOF
          jq --exit-status . "dist/linux-provenance-${{ matrix.arch }}.json" >/dev/null
          (cd dist && sha256sum "linux-provenance-${{ matrix.arch }}.json" > "linux-provenance-${{ matrix.arch }}.json.sha256")
          test "$(tar -tzf "dist/${asset}")" = "sing-box"
          file package/sing-box
      - name: Upload Linux runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydracore-vps-linux-${{ matrix.arch }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish verified runtime
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       inputs.publish == true &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/debug')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, android, linux]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Download verified libbox artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hydracore-client-${{ github.sha }}
          path: dist
      - name: Download verified Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: hydracore-vps-linux-*-${{ github.sha }}
          path: dist
          merge-multiple: true
      - name: Verify downloaded artifact
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check ./*.sha256)
          hydracore_version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          source release/UPSTREAM_BASELINE
          jq --exit-status \
            --arg commit "$GITHUB_SHA" \
            --arg hydracore_version "$hydracore_version" \
            --arg upstream_commit "$UPSTREAM_COMMIT" \
            --arg android_ndk_requested "$ANDROID_NDK_VERSION" \
            '.schema_version == 3 and
             .source.commit == $commit and
             .distribution.version == $hydracore_version and
             .distribution.role == "client" and
             .upstream.project == "sing-box-extended" and
             .upstream.commit == $upstream_commit and
             .android.ndk_requested == $android_ndk_requested' \
            dist/provenance.json >/dev/null
          for artifact in \
            hydracore-client-libbox.aar \
            hydracore-client-libbox-sources.jar \
            hydracore-source.tar.gz \
            HYDRA_SUBSCRIPTION_V2.md \
            hydra-subscription-v2.schema.json \
            hydra-subscription-jwe-v2.schema.json; do
            actual="$(sha256sum "dist/${artifact}" | awk '{print $1}')"
            recorded="$(jq -r --arg artifact "$artifact" '.artifacts[$artifact].sha256' dist/provenance.json)"
            test "$actual" = "$recorded"
          done
          for arch in amd64 arm64; do
            asset="hydracore-vps-linux-${arch}.tar.gz"
            test "$(tar -tzf "dist/${asset}")" = "sing-box"
            actual="$(sha256sum "dist/${asset}" | awk '{print $1}')"
            recorded="$(jq -r '.artifact.sha256' "dist/linux-provenance-${arch}.json")"
            test "$actual" = "$recorded"
            jq --exit-status \
              --arg commit "$GITHUB_SHA" \
              --arg version "$hydracore_version" \
              --arg arch "$arch" \
              '.source.commit == $commit and
               .distribution.version == $version and
               .distribution.role == "vps" and
               .runtime.os == "linux" and
               .runtime.arch == $arch and
               .artifact.name == ("hydracore-vps-linux-" + $arch + ".tar.gz") and
               .artifact.binary == "sing-box"' \
              "dist/linux-provenance-${arch}.json" >/dev/null
          done
          mkdir -p verify-linux
          tar -xzf dist/hydracore-vps-linux-amd64.tar.gz -C verify-linux
          verify-linux/sing-box version | grep -F "$hydracore_version"
          verify-linux/sing-box hydra capabilities --json | jq --exit-status \
            '.identity.role == "vps" and
             .features.call_vk_parasite == true and
             .features.call_vk_parasite_client == false and
             .features.call_vk_parasite_server == true and
             .features.call_vk_telemetry == true and
             .features.call_vk_four_lane_kcp == true and
             .features.call_vk_pre_kcp_admission == true and
             .features.call_vk_relay_flow_control == true and
             .protocols.call_modes == ["vk_parasite"] and
             .protocols.call_vk_parasite_wire == {"min": 8, "max": 8}' >/dev/null
          jq -n \
            --arg version "$hydracore_version" \
            --arg commit "$GITHUB_SHA" \
            --arg client_aar "$(sha256sum dist/hydracore-client-libbox.aar | awk '{print $1}')" \
            --arg client_sources "$(sha256sum dist/hydracore-client-libbox-sources.jar | awk '{print $1}')" \
            --arg vps_amd64 "$(sha256sum dist/hydracore-vps-linux-amd64.tar.gz | awk '{print $1}')" \
            --arg vps_arm64 "$(sha256sum dist/hydracore-vps-linux-arm64.tar.gz | awk '{print $1}')" \
            '{
              schema_version: 1,
              distribution: {id: "io.hydrabox.hydracore", version: $version},
              source: {commit: $commit},
              artifacts: {
                "hydracore-client-libbox.aar": {role: "client", sha256: $client_aar},
                "hydracore-client-libbox-sources.jar": {role: "client", sha256: $client_sources},
                "hydracore-vps-linux-amd64.tar.gz": {role: "vps", sha256: $vps_amd64},
                "hydracore-vps-linux-arm64.tar.gz": {role: "vps", sha256: $vps_arm64}
              }
            }' > dist/hydracore-release-manifest.json
          (cd dist && sha256sum hydracore-release-manifest.json > hydracore-release-manifest.json.sha256)
      - name: Sign HydraCore bundle manifest
        shell: bash
        env:
          HYDRACORE_BUNDLE_KEY_ID: ${{ vars.HYDRACORE_BUNDLE_KEY_ID }}
          HYDRACORE_ED25519_PRIVATE_KEY: ${{ secrets.HYDRACORE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$HYDRACORE_ED25519_PRIVATE_KEY"
          source release/UPSTREAM_BASELINE
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          key_id="${HYDRACORE_BUNDLE_KEY_ID:-hydracore-release-1}"
          published_at="$(git show -s --format=%cI HEAD)"
          go run ./cmd/internal/build_core_bundle \
            -aar dist/hydracore-client-libbox.aar \
            -capabilities dist/hydracore-client-capabilities.json \
            -out dist \
            -version "$version" \
            -source-commit "$GITHUB_SHA" \
            -upstream-commit "$UPSTREAM_COMMIT" \
            -published-at "$published_at" \
            -key-id "$key_id" \
            -release-sequence "$GITHUB_RUN_NUMBER" \
            -private-key "$HYDRACORE_ED25519_PRIVATE_KEY"
          (cd dist && sha256sum hydracore-bundle-manifest-v1.sig \
            > hydracore-bundle-manifest-v1.sig.sha256)
      - name: Create, populate, and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < release/HYDRACORE_VERSION)"
          test -n "$version"
          title="HydraCore ${version} - verified client and VPS runtimes"

          if [[ "$GITHUB_REF" == "refs/heads/debug" ]]; then
            if [[ "$version" != *-debug.* ]]; then
              echo "Debug branch version must contain -debug.: ${version}" >&2
              exit 1
            fi
            if gh release view "$version" --json isPrerelease > release-state.json 2>/dev/null; then
              if [[ "$(jq -r '.isPrerelease' release-state.json)" != "true" ]]; then
                echo "Refusing to replace non-debug release ${version}" >&2
                exit 1
              fi
              gh release edit "$version" \
                --prerelease \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes-file release/HYDRACORE_RELEASE_NOTES.md
            else
              gh release create "$version" \
                --prerelease \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes-file release/HYDRACORE_RELEASE_NOTES.md
            fi
          else
            if [[ "$version" == *-debug.* ]]; then
              echo "Stable publication cannot use a debug version: ${version}" >&2
              exit 1
            fi
            if gh release view "$version" --json isDraft > release-state.json 2>/dev/null; then
              if [[ "$(jq -r '.isDraft' release-state.json)" != "true" ]]; then
                echo "Refusing to replace published release ${version}" >&2
                exit 1
              fi
              gh release edit "$version" \
                --draft \
                --prerelease=false \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes-file release/HYDRACORE_RELEASE_NOTES.md
            else
              gh release create "$version" \
                --draft \
                --target "$GITHUB_SHA" \
                --title "$title" \
                --notes-file release/HYDRACORE_RELEASE_NOTES.md
            fi
          fi

          gh release upload "$version" dist/* --clobber
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            gh release edit "$version" \
              --draft=false \
              --prerelease=false \
              --latest
          fi
