syntax = "proto3";

package daemon;
option go_package = "github.com/sagernet/sing-box/daemon";

import "google/protobuf/empty.proto";

service StartedService {
  rpc StopService(google.protobuf.Empty) returns (google.protobuf.Empty);
  rpc ReloadService(google.protobuf.Empty) returns (google.protobuf.Empty);

  rpc SubscribeServiceStatus(google.protobuf.Empty) returns(stream ServiceStatus) {}
  rpc SubscribeLog(google.protobuf.Empty) returns(stream Log) {}
  rpc GetDefaultLogLevel(google.protobuf.Empty) returns(DefaultLogLevel) {}
  rpc ClearLogs(google.protobuf.Empty) returns(google.protobuf.Empty) {}
  rpc SubscribeStatus(SubscribeStatusRequest) returns(stream Status) {}
  rpc SubscribeGroups(google.protobuf.Empty) returns(stream Groups) {}

  rpc GetClashModeStatus(google.protobuf.Empty) returns(ClashModeStatus) {}
  rpc SubscribeClashMode(google.protobuf.Empty) returns(stream ClashMode) {}
  rpc SetClashMode(ClashMode) returns(google.protobuf.Empty) {}

  rpc GetRuntimeSnapshot(google.protobuf.Empty) returns(RuntimeSnapshot) {}
  rpc SubscribeRuntimeEvents(RuntimeEventRequest) returns(stream RuntimeEvents) {}

  rpc StartURLTest(URLTestRequest) returns(URLTestSession) {}
  rpc GetURLTestSession(URLTestSessionRequest) returns(URLTestSession) {}
  rpc CancelURLTest(URLTestSessionRequest) returns(URLTestSession) {}
  rpc SubscribeURLTestEvents(URLTestEventRequest) returns(stream URLTestEvents) {}
  rpc LookupOutboundExternalInfo(OutboundExternalInfoRequest) returns(OutboundExternalInfoResponse) {}
  rpc SelectOutbound(SelectOutboundRequest) returns (google.protobuf.Empty) {}
  rpc SetGroupExpand(SetGroupExpandRequest) returns (google.protobuf.Empty) {}

  rpc GetSystemProxyStatus(google.protobuf.Empty) returns(SystemProxyStatus) {}
  rpc SetSystemProxyEnabled(SetSystemProxyEnabledRequest) returns(google.protobuf.Empty) {}

  rpc SubscribeConnections(SubscribeConnectionsRequest) returns(stream ConnectionEvents) {}
  rpc CloseConnection(CloseConnectionRequest) returns(google.protobuf.Empty) {}
  rpc CloseAllConnections(google.protobuf.Empty) returns(google.protobuf.Empty) {}
  rpc GetDeprecatedWarnings(google.protobuf.Empty) returns(DeprecatedWarnings) {}
  rpc GetStartedAt(google.protobuf.Empty) returns(StartedAt) {}
}

message ServiceStatus {
  enum Type {
    IDLE = 0;
    STARTING = 1;
    STARTED = 2;
    STOPPING = 3;
    FATAL = 4;
  }
  Type status = 1;
  string errorMessage = 2;
}

message ReloadServiceRequest {
  string newProfileContent = 1;
}

message SubscribeStatusRequest {
  int64 interval = 1;
}

enum LogLevel {
  PANIC = 0;
  FATAL = 1;
  ERROR = 2;
  WARN = 3;
  NOTICE = 4;
  INFO = 5;
  DEBUG = 6;
  TRACE = 7;
}

message Log {
  repeated Message messages = 1;
  bool reset = 2;
  message Message {
    LogLevel level = 1;
    string message = 2;
  }
}

message DefaultLogLevel {
  LogLevel level = 1;
}

message Status {
  uint64 memory = 1;
  int32 goroutines = 2;
  int32 connectionsIn = 3;
  int32 connectionsOut = 4;
  bool trafficAvailable = 5;
  int64 uplink = 6;
  int64 downlink = 7;
  int64 uplinkTotal = 8;
  int64 downlinkTotal = 9;
}

message Groups {
  repeated Group group = 1;
}

message Group {
  string tag = 1;
  string type = 2;
  bool selectable = 3;
  string selected = 4;
  bool isExpand = 5;
  repeated GroupItem items = 6;
}

message GroupItem {
  string tag = 1;
  string type = 2;
  int64 urlTestTime = 3;
  int32 urlTestDelay = 4;
  string urlTestStatus = 5;
  string urlTestError = 6;
  string urlTestErrorCode = 7;
}

message URLTestRequest {
  string groupTag = 1;
  string urlTestUrl = 2;
  string targetOutboundTag = 3;
  string priorityOutboundTag = 4;
  string excludeOutboundTag = 5;
  int32 timeoutMillis = 6;
  int32 concurrency = 7;
  int32 deadlineMillis = 8;
  bool force = 9;
}

enum URLTestSessionState {
  URL_TEST_SESSION_QUEUED = 0;
  URL_TEST_SESSION_RUNNING = 1;
  URL_TEST_SESSION_SUCCEEDED = 2;
  URL_TEST_SESSION_FAILED = 3;
  URL_TEST_SESSION_CANCELLED = 4;
}

message URLTestResult {
  string outboundTag = 1;
  int64 delayMillis = 2;
  int64 observedAt = 3;
  string status = 4;
  string errorCode = 5;
  string errorMessage = 6;
}

message URLTestSession {
  string id = 1;
  string groupTag = 2;
  URLTestSessionState state = 3;
  int64 startedAt = 4;
  int64 completedAt = 5;
  int32 total = 6;
  int32 completed = 7;
  int32 succeeded = 8;
  int32 failed = 9;
  repeated URLTestResult results = 10;
  string errorCode = 11;
  string errorMessage = 12;
}

message URLTestSessionRequest {
  string id = 1;
}

message URLTestEventRequest {
  int64 intervalMillis = 1;
}

message URLTestEvents {
  uint64 sequence = 1;
  bool reset = 2;
  repeated URLTestSession sessions = 3;
}

message RuntimeSnapshot {
  int32 schemaVersion = 1;
  uint64 sequence = 2;
  int64 observedAt = 3;
  ServiceStatus service = 4;
  int64 startedAt = 5;
  Status status = 6;
  Groups groups = 7;
  ClashModeStatus clashMode = 8;
  repeated URLTestSession urlTestSessions = 9;
}

message RuntimeEventRequest {
  int64 intervalMillis = 1;
}

enum RuntimeEventType {
  RUNTIME_EVENT_SERVICE = 0;
  RUNTIME_EVENT_STATUS = 1;
  RUNTIME_EVENT_GROUPS = 2;
  RUNTIME_EVENT_CLASH_MODE = 3;
  RUNTIME_EVENT_URL_TEST_SESSIONS = 4;
}

message RuntimeEvent {
  RuntimeEventType type = 1;
  ServiceStatus service = 2;
  Status status = 3;
  Groups groups = 4;
  ClashModeStatus clashMode = 5;
  repeated URLTestSession urlTestSessions = 6;
  int64 startedAt = 7;
}

message RuntimeEvents {
  uint64 sequence = 1;
  bool reset = 2;
  RuntimeSnapshot snapshot = 3;
  repeated RuntimeEvent events = 4;
}

message OutboundExternalInfoRequest {
  string outboundTag = 1;
}

message OutboundExternalInfoResponse {
  string ip = 1;
  string countryCode = 2;
}

message SelectOutboundRequest {
  string groupTag = 1;
  string outboundTag = 2;
}

message SetGroupExpandRequest {
  string groupTag = 1;
  bool isExpand = 2;
}

message ClashMode {
  string mode = 3;
}

message ClashModeStatus {
  repeated string modeList = 1;
  string currentMode = 2;
}

message SystemProxyStatus {
  bool available = 1;
  bool enabled = 2;
}

message SetSystemProxyEnabledRequest {
  bool enabled = 1;
}

message SubscribeConnectionsRequest {
  int64 interval = 1;
}

enum ConnectionEventType {
  CONNECTION_EVENT_NEW = 0;
  CONNECTION_EVENT_UPDATE = 1;
  CONNECTION_EVENT_CLOSED = 2;
}

message ConnectionEvent {
  ConnectionEventType type = 1;
  string id = 2;
  Connection connection = 3;
  int64 uplinkDelta = 4;
  int64 downlinkDelta = 5;
  int64 closedAt = 6;
}

message ConnectionEvents {
  repeated ConnectionEvent events = 1;
  bool reset = 2;
}

message Connection {
  string id = 1;
  string inbound = 2;
  string inboundType = 3;
  int32 ipVersion = 4;
  string network = 5;
  string source = 6;
  string destination = 7;
  string domain = 8;
  string protocol = 9;
  string user = 10;
  string fromOutbound = 11;
  int64 createdAt = 12;
  int64 closedAt = 13;
  int64 uplink = 14;
  int64 downlink = 15;
  int64 uplinkTotal = 16;
  int64 downlinkTotal = 17;
  string rule = 18;
  string outbound = 19;
  string outboundType = 20;
  repeated string chainList = 21;
  ProcessInfo processInfo = 22;
}

message ProcessInfo {
  uint32 processId = 1;
  int32 userId = 2;
  string userName = 3;
  string processPath = 4;
  repeated string packageNames = 5;
}

message CloseConnectionRequest {
  string id = 1;
}

message DeprecatedWarnings {
  repeated DeprecatedWarning warnings = 1;
}

message DeprecatedWarning {
  string message = 1;
  bool impending = 2;
  string migrationLink = 3;
}

message StartedAt {
  int64 startedAt = 1;
}
